name: KartuRT V1 UAT branch-only read-only preflight
run-name: UAT branch preflight | ${{ github.sha }}

on:
  push:
    branches:
      - codex/v1-uat-preview-migration-workflow-20261103
    paths:
      - .github/workflows/v1-uat-branch-preflight.yml
      - scripts/v1-uat-preview-migration-preflight.ts

permissions:
  contents: read

concurrency:
  group: karturt-v1-uat-branch-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: UAT Neon PG18 TLS and roles (no migrations)
    if: >-
      github.repository == 'karturt-app/karturt' &&
      github.ref == 'refs/heads/codex/v1-uat-preview-migration-workflow-20261103' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: karturt-v1-uat
    env:
      APP_ENV: preview
      DATABASE_ENV: preview
      KARTURT_PREVIEW_TARGET_ID: quiet-credit-75135059/br-weathered-base-aodwvapx/ep-tiny-base-aocoa7m9/karturt_preview
      KARTURT_PRODUCTION_TARGET_ID: holy-term-22410117/br-jolly-bonus-azzd71cl/ep-empty-rain-azwe3eb3/karturt_production

    steps:
      - name: Check out only this UAT branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact baseline and no application-code modifications
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BASE_SHA=ff9b992bd3154d2cfb65dd14bcb0f1de452b29f1
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          while IFS= read -r file; do
            case "$file" in
              ".github/workflows/v1-uat-preview-migrate.yml"|\
              ".github/workflows/v1-uat-branch-preflight.yml"|\
              ".github/workflows/v1-uat-branch-migrate.yml"|\
              "scripts/v1-uat-preview-migration-preflight.ts"|\
              "docs/v1-uat-github-runner.md")
                ;;
              *)
                echo "UAT branch contains unauthorized file change. Stop before reading credentials."
                exit 1
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" HEAD)
          echo "Exact application baseline and isolated preflight-only branch verified."

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Official 16-migration plan (read-only)
        env:
          DATABASE_URL: ${{ secrets.KARTURT_UAT_PREVIEW_DATABASE_URL }}
        run: npm run db:migrate:preview:plan

      - name: Strict read-only connection preflight (both Neon roles, Node TLS)
        env:
          DATABASE_URL: ${{ secrets.KARTURT_UAT_PREVIEW_DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ secrets.KARTURT_UAT_PREVIEW_DATABASE_MIGRATION_URL }}
        run: npx --no-install tsx scripts/v1-uat-preview-migration-preflight.ts

      - name: Publish nonsecret evidence
        if: success()
        env:
          RUN_SHA: ${{ github.sha }}
        run: |
          {
            echo "## Isolated KartuRT V1 Preview preflight PASS"
            echo "- Code SHA: $RUN_SHA"
            echo "- Database: karturt_preview (separate Neon project)"
            echo "- Verified: both roles, TLS, least-privilege, empty DB, official migration plan"
            echo "- Database writes: NONE"
            echo "- Production deployment: NOT triggered by this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
